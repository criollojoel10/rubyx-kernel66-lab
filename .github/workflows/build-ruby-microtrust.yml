name: Build ruby microtrust TEE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          set +e
          sudo apt-get remove --purge -y 'php*' 'dotnet*' 'mysql*' 'nodejs*' 'clang*' 'google*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$d"
          done
          set -e
          df -h

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates gnupg python3 python3-pip \
            bc bison flex cpio libssl-dev libelf-dev lz4 zstd unzip patch
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Caché Bazel + Clang
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/ruby/clang-r536225
          key: a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ hashFiles('port/**', 'configs/ruby-6.6/*', 'scripts/patch-*.py', 'configs/ruby-6.6/microtrust.fragment') }}-${{ github.sha }}
          restore-keys: |
            a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ hashFiles('port/**', 'configs/ruby-6.6/*', 'scripts/patch-*.py') }}-
      - name: Fetch A34
        run: make fetch

      - name: Habilitar Microtrust TEEI 400 en el overlay de TEE
        run: ./scripts/patch-mtk-tee-config.sh

      - name: Conectar los device modules con el kbuild del GKI
        run: ./scripts/patch-gki-mtk-drm.sh sources/a34x tee

      - name: Declarar los modulos nuevos en Kleaf
        # El TEEI se compila built-in (=y) como en el kernel stock de ruby:
        # el GKI lo incluye con obj-y += ../$(DEVICE_MODULES_REL_DIR)/drivers/tee/.
        # Por eso no hay ningun .ko de TEE que recoger.
        run: ./scripts/patch-kleaf-tee-builtin.py sources/a34x

      - name: Build con Microtrust TEEI 400
        env:
          RUBY_OVERLAY: configs/ruby-6.6/microtrust.fragment
        run: make build-fast

      - name: Recolectar
        run: make collect

      - name: Verificar Microtrust
        run: |
          grep -E '^CONFIG_MICROTRUST_TEE_SUPPORT=m' artifacts/a34-6.6.127/device-modules.config
          grep -E '^CONFIG_MICROTRUST_TEE_VERSION="400"' artifacts/a34-6.6.127/device-modules.config
          grep -E ' isee|tz_driver|teei' artifacts/a34-6.6.127/System.map | head -5

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-microtrust
          path: artifacts/
          if-no-files-found: warn

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-microtrust-logs
          path: logs/
          if-no-files-found: warn
