name: Build ruby diag boot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates python3 python3-pip \
            cpio lz4 zstd unzip patch device-tree-compiler \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          df -h

      - name: Descargar artefacto A34 verificado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39480753110 --repo "$GITHUB_REPOSITORY" -n a34-fast -D a34-artifact
          test -f a34-artifact/a34-6.6.127/Image.gz
          test -f a34-artifact/a34-6.6.127/a34-all-modules.tar.zst
          sha256sum a34-artifact/a34-6.6.127/Image.gz a34-artifact/a34-6.6.127/a34-all-modules.tar.zst

      - name: Descargar boot stock de la release
        run: |
          curl -L --fail -o /tmp/stock-boot.img \
            https://github.com/RubyxLabs/releases/releases/download/rubyx-20261015/boot.img
          echo "c9d6ad0d7e8921f708de65cbc71817d9bfb88f82c0768d87672f29a8000252aa  /tmp/stock-boot.img" | sha256sum -c -

      - name: DTB stock con pstore/probe
        run: |
          ./scripts/make-stock-dtb.py \
            --boot /tmp/stock-boot.img \
            --out /tmp/ruby-stock-base.dtb \
            --dts /tmp/ruby-stock-base.dts \
            --dtbo dts/ruby-dtbo.dts

      - name: Init de diagnóstico
        run: |
          aarch64-linux-gnu-gcc --sysroot=/usr/aarch64-linux-gnu \
            -static -Os -o /tmp/ruby-diag-init3 port/diag/diag-init.c

      - name: Cierre de 11 módulos
        run: |
          rm -rf /tmp/a34-allmods
          mkdir -p /tmp/a34-allmods
          tar --zstd -xf a34-artifact/a34-6.6.127/a34-all-modules.tar.zst -C /tmp/a34-allmods
          ./scripts/close-module-deps.py /tmp/a34-allmods port/modules/console-min.list
          ./scripts/make-module-bundle.py /tmp/a34-allmods

      - name: Initramfs
        run: |
          ./scripts/build-diag-initramfs.py /tmp/ruby-diag-init3 port/modules/closure /tmp/ruby-diag-initramfs.cpio.gz

      - name: Boot image
        run: |
          ./scripts/build-diag-boot.py \
            --original /tmp/stock-boot.img \
            --kernel a34-artifact/a34-6.6.127/Image.gz \
            --initramfs /tmp/ruby-diag-initramfs.cpio.gz \
            --dtb /tmp/ruby-stock-base.dtb \
            --out /tmp/ruby-diag-boot.img
          sha256sum /tmp/ruby-diag-boot.img /tmp/ruby-stock-base.dtb > /tmp/ruby-diag.sha256
          mkdir -p out
          cp /tmp/ruby-diag-boot.img /tmp/ruby-stock-base.dtb /tmp/ruby-diag-initramfs.cpio.gz /tmp/ruby-diag.sha256 out/

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-diag-boot
          path: out/
          if-no-files-found: warn
