name: Check Kconfig de los ports

# Comprobacion rapida (2 min) de que los simbolos nuevos de los ports
# existen en el Kconfig que se parsea de verdad. Sin esto, un Kconfig mal
# integrado hace que el build pase en verde sin compilar el modulo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libelf-dev
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Fetch A34
        run: make fetch

      - name: Aplicar los ports
        run: |
          ./port/display/apply.sh
          ./port/touch/apply.sh
          ./port/charger/apply.sh

      - name: Declarar los modulos en Kleaf
        run: |
          python3 scripts/patch-kleaf-outs.py \
            drivers/tee/teei/400/isee.ko \
            drivers/gpu/drm/panel/panel-m16-36-02-0b-dsc-vdo.ko \
            drivers/input/touchscreen/focaltech_3680/focaltech_3680.ko \
            drivers/power/supply/mps/mp2762.ko \
            drivers/power/supply/ln/ln8410.ko \
            drivers/power/supply/ti/bq25980.ko \
            drivers/power/supply/southchip/sc8561.ko \
            drivers/power/supply/maxim/max77932.ko \
            drivers/power/supply/xiaomi/xmusb350.ko

      - name: Parsear el Kconfig real
        run: |
          set -e
          cd sources/a34x/kernel/kernel-6.6
          export KCONFIG_EXT_PREFIX=../kernel_device_modules-6.6/
          make ARCH=arm64 LLVM=1 -j$(nproc) scripts/kconfig/conf
          DM=../kernel_device_modules-6.6
          ./scripts/kconfig/conf \
            --defconfig=$DM/arch/arm64/configs/mediatek-bazel_defconfig \
            /tmp/test.config
          for f in panel touch charger; do
            ./scripts/kconfig/merge_config.sh -m -O /tmp/test.config \
              /tmp/test.config $OLDPWD/configs/ruby-6.6/$f.fragment
          done
          echo "=== simbolos de nuestros ports en el .config:"
          grep -E 'TOUCHSCREEN_FOCALTECH_3680|DRM_PANEL_M16_36_02_0B_DSC_VDO|RUBY_(MP2762|LN8410|BQ25980|SC8561|MAX77932|XMUSB350)' /tmp/test.config || {
            echo "FALTAN LOS SIMBOLOS: el Kconfig no los expone"; exit 1; }

      - name: Comprobar los Makefile
        run: |
          set -e
          DM=sources/a34x/kernel/kernel_device_modules-6.6
          grep -q 'panel-m16-36-02-0b-dsc-vdo.o' $DM/drivers/gpu/drm/panel/Makefile
          grep -q 'focaltech_3680/' $DM/drivers/input/touchscreen/Makefile
          grep -q 'RUBY_MP2762' $DM/drivers/power/supply/Makefile
          echo "Makefile OK"
