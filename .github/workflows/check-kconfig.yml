name: Check Kconfig de los ports

# Comprobacion rapida (2-3 min) de que los simbolos nuevos de los ports
# existen en el Kconfig que se parsea de verdad y que el overlay los activa.
# Sin esto, un Kconfig mal integrado hace que el build pase en verde sin
# compilar el modulo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev libelf-dev
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Fetch A34
        run: make fetch

      - name: Aplicar los ports
        run: |
          ./port/display/apply.sh
          ./port/touch/apply.sh
          ./port/charger/apply.sh

      - name: Parsear el Kconfig real
        run: |
          set -e
          cd sources/a34x/kernel/kernel-6.6
          # kernel-6.6 es un symlink: el CWD real es sources/a34x/kernel-6.6
          export KCONFIG_EXT_PREFIX=../kernel/kernel_device_modules-6.6/
          DM=../kernel/kernel_device_modules-6.6
          # defconfig de los device modules + sus overlays + nuestros fragments
          cp $DM/arch/arm64/configs/mediatek-bazel_defconfig arch/arm64/configs/
          cat $DM/kernel/configs/mt6877_overlay.config \
              $DM/kernel/configs/mt6877_teegris_5_overlay.config \
              $OLDPWD/configs/ruby-6.6/panel.fragment \
              $OLDPWD/configs/ruby-6.6/touch.fragment \
              $OLDPWD/configs/ruby-6.6/charger.fragment \
              >> arch/arm64/configs/mediatek-bazel_defconfig
          make ARCH=arm64 LLVM=1 -j$(nproc) mediatek-bazel_defconfig
          echo
          echo "=== sanity: simbolo de los device modules (PINCTRL_MT6877):"
          grep -E '^CONFIG_PINCTRL_MT6877=' .config || { echo "el Kconfig.ext NO se sourcea"; exit 1; }
          echo
          echo "=== simbolos de nuestros ports:"
          grep -E '^CONFIG_(TOUCHSCREEN_FOCALTECH_3680|DRM_PANEL_M16_36_02_0B_DSC_VDO|RUBY_(MP2762|LN8410|BQ25980|SC8561|MAX77932|XMUSB350))=' .config || {
            echo "FALTAN LOS SIMBOLOS: el Kconfig no los expone"; exit 1; }

      - name: Comprobar los Makefile
        run: |
          set -e
          DM=sources/a34x/kernel/kernel_device_modules-6.6
          grep -q 'panel-m16-36-02-0b-dsc-vdo.o' $DM/drivers/gpu/drm/panel/Makefile
          grep -q 'focaltech_3680/' $DM/drivers/input/touchscreen/Makefile
          grep -q 'RUBY_MP2762' $DM/drivers/power/supply/Makefile
          echo "Makefile OK"
