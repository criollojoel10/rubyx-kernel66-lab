name: Build ruby touch FT3680

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          set +e
          sudo apt-get remove --purge -y 'php*' 'dotnet*' 'mysql*' 'nodejs*' 'clang*' 'google*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$d"
          done
          set -e
          df -h

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates gnupg python3 python3-pip \
            bc bison flex cpio libssl-dev libelf-dev lz4 zstd unzip patch
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Caché Bazel + Clang
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/ruby/clang-r536225
          key: a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ hashFiles('configs/ruby-6.6/touch.fragment') }}-${{ github.sha }}
          restore-keys: |
            a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            ds-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            core-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            kabi-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            mt-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            panel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            fast-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            bazel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-

      - name: Fetch A34
        run: make fetch

      - name: Aplicar el driver del tactil FT3680
        run: ./port/touch/apply.sh

      - name: Build con el tactil FT3680
        env:
          RUBY_OVERLAY: configs/ruby-6.6/touch.fragment
        run: make build-fast

      - name: Verificar el modulo del tactil
        run: |
          grep -E '^CONFIG_TOUCHSCREEN_FOCALTECH_3680=m' artifacts/a34-6.6.127/device-modules.config
          tar --zstd -tf artifacts/a34-6.6.127/a34-all-modules.tar.zst | grep -E 'focaltech_3680\.ko$'

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-touch
          path: artifacts/
          if-no-files-found: warn

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-touch-logs
          path: logs/
          if-no-files-found: warn
