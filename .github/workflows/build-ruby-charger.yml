name: Build ruby charger drivers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          set +e
          sudo apt-get remove --purge -y 'php*' 'dotnet*' 'mysql*' 'nodejs*' 'clang*' 'google*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$d"
          done
          set -e
          df -h

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates gnupg python3 python3-pip \
            bc bison flex cpio libssl-dev libelf-dev lz4 zstd unzip patch
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Caché Bazel + Clang
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/ruby/clang-r536225
          key: a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ hashFiles('port/**', 'configs/ruby-6.6/*', 'scripts/patch-*.py', 'configs/ruby-6.6/charger.fragment') }}-${{ github.sha }}
          restore-keys: |
            a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ hashFiles('port/**', 'configs/ruby-6.6/*', 'scripts/patch-*.py') }}-
      - name: Fetch A34
        run: make fetch

      - name: Aplicar los drivers de carga de ruby
        run: ./port/charger/apply.sh

      - name: Declarar los modulos nuevos en Kleaf
        run: python3 scripts/patch-kleaf-outs.py --gki drivers/power/supply/mps/mp2762.ko drivers/power/supply/ln/ln8410.ko drivers/power/supply/ti/bq25980.ko drivers/power/supply/southchip/sc8561.ko drivers/power/supply/maxim/max77932.ko drivers/power/supply/xiaomi/xmusb350.ko

      - name: Build con los drivers de carga
        env:
          RUBY_OVERLAY: configs/ruby-6.6/charger.fragment
        run: make build-fast

      - name: Recolectar
        run: make collect

      - name: Verificar los modulos de carga
        run: |
          grep -E '^CONFIG_RUBY_(MP2762|LN8410|BQ25980|SC8561|MAX77932|XMUSB350)=m' artifacts/a34-6.6.127/device-modules.config
          tar --zstd -tf artifacts/a34-6.6.127/a34-all-modules.tar.zst | grep -E '(mp2762|ln8410|bq25980|sc8561|max77932|xmusb350)\.ko$'

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-charger
          path: artifacts/
          if-no-files-found: warn

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-charger-logs
          path: logs/
          if-no-files-found: warn
