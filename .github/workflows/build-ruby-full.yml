name: Build ruby kernel completo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          set +e
          sudo apt-get remove --purge -y 'php*' 'dotnet*' 'mysql*' 'nodejs*' 'clang*' 'google*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$d"
          done
          set -e
          df -h

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates gnupg python3 python3-pip \
            bc bison flex cpio libssl-dev libelf-dev lz4 zstd unzip patch
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Caché Bazel + Clang
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/ruby/clang-r536225
          key: a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ hashFiles('port/**') }}-${{ hashFiles('scripts/apply-ruby-fragment.sh') }}-${{ github.sha }}
          restore-keys: |
            a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            ds-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            core-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            kabi-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            mt-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            panel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            fast-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            bazel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-

      - name: Fetch A34
        run: make fetch

      - name: Aplicar todos los ports de ruby
        run: ./port/apply-all.sh

      # apply-all mete el fragmento en el .config de los device modules, y ese
      # .config no llega a la Image: la Image se genera solo desde
      # kernel-6.6/gki_defconfig. Los ports de display/tactil/huella/TEE
      # copian sus drivers al arbol del GKI, asi que sus simbolos =y se
      # aplican aqui para que de verdad entren en la Image.
      - name: Built-ins de ruby en el GKI
        run: ./scripts/patch-gki-core.sh configs/ruby-6.6/gki-builtins.fragment

      - name: Build del kernel de producto
        run: make build-fast

      - name: Recolectar
        run: make collect

      - name: Verificar los drivers de ruby
        run: |
          set -e
          IMG=artifacts/a34-6.6.127/Image
          # El config que lleva el Image (IKCONFIG) solo tiene simbolos del
          # GKI: los de los device modules (panel, touch, huella, TEE, audio)
          # viven en el .config del arbol de device modules, que collect copia
          # como device-modules.config. Comprobar los =y/=m contra $CFG hacia
          # fallar la verificacion con un build correcto.
          CFG=artifacts/a34-6.6.127/device-modules.config
          IMGCFG=artifacts/a34-6.6.127/config

          # 1) En la Image solo va el TEE. El display (mediatek_v2 + paneles
          #    m16), el tactil FT3680 y la huella Goodix siguen siendo
          #    modulos: meterlos en la Image obligaba a arrastrar medio arbol
          #    de vendor (mtk_disp_notify, mtk_panel_ext, prize, ...).
          echo "== el stack de vendor no se cuela en la Image"
          for s in \
            "panel-m16-42-0d-0a-dsc-vdo" \
            "focaltech,3680-spi" \
            "goodix,goodix-fp" ; do
            if strings "$IMG" | grep -qF "$s"; then
              echo "AVISO: $s esta built-in en la Image"
            else
              echo "OK  $s va como modulo"
            fi
          done

          # 2) built-in (=y) en la config del arbol que compila los device modules
          [ -s "$CFG" ] || CFG="$IMGCFG"
          if [ -s "$CFG" ]; then
            echo "== config de los device modules"
            for sym in \
              CONFIG_DRM_MEDIATEK_V2 \
              CONFIG_TOUCHSCREEN_FOCALTECH_3680 \
              CONFIG_GOODIX_CAP_FINGERPRINT ; do
              grep -qx "$sym=y" "$CFG" \
                && echo "OK  $sym=y" \
                || echo "AVISO: $sym no esta =y en los device modules"
            done

            # El TEE es built-in del GKI (en los device modules su simbolo
            # vale =m y su Makefile esta desenganchado): lo que importa es que
            # isee acabe enlazado en el kernel, no en el tar de modulos.
            echo "== TEE built-in en el kernel"
            grep -q "isee" artifacts/a34-6.6.127/System.map \
              && echo "OK  isee en System.map" \
              || { echo "FALTA isee en el kernel (TEE)"; exit 1; }

            # 2b) los paneles m16 son MODULOS del arbol de device modules: =m en
          #     su config y el .ko dentro del tar del mismo build (si falta el
          #     .ko, mediatek-drm no encontrara panel que enlazar en el DSI)
          echo "== paneles m16 (=m y .ko en el tar)"
          tar --zstd -tf artifacts/a34-6.6.127/a34-all-modules.tar.zst > /tmp/mods.txt
          for p in 42-0d-0a 36-02-0b 45-02-0c; do
            sym="CONFIG_DRM_PANEL_M16_$(echo "$p" | tr 'a-z-' 'A-Z_')_DSC_VDO"
            grep -qx "$sym=m" "$CFG" \
              || { echo "FALTA $sym=m en la config de los device modules"; exit 1; }
            grep -q "panel-m16-$p-dsc-vdo\.ko$" /tmp/mods.txt \
              || { echo "FALTA panel-m16-$p-dsc-vdo.ko en el tar"; exit 1; }
            echo "OK  $p =m y en el tar"
          done

          # 3) la cadena de audio de MT6877 va como modulos y se compila en
            #    el arbol de device modules; si desaparece de la config, el
            #    build la ignora en silencio (olddefconfig)
            echo "== config del audio (=m)"
            for sym in \
              CONFIG_DEVICE_MODULES_SND_SOC_MEDIATEK \
              CONFIG_DEVICE_MODULES_SND_SOC_MT6359P \
              CONFIG_SND_SOC_MTK_SMART_PHONE \
              CONFIG_SND_SOC_MTK_SRAM \
              CONFIG_SND_SOC_MT6877 \
              CONFIG_SND_SOC_MT6877_MT6359P ; do
              grep -qx "$sym=m" "$CFG" \
                && echo "OK  $sym=m" \
                || { echo "FALTA $sym=m"; exit 1; }
            done
          else
            echo "AVISO: no hay config de los device modules; me quedo con las cadenas"
          fi

          # 4) los .ko de ruby tienen que estar en el tar de modulos, y el TEE
          #    no puede haberse colado como modulo (isee.ko va built-in).
          #    Ojo: el tar aplana las rutas de los modulos, asi que se busca
          #    por nombre de fichero y no por sound/soc/...
          echo "== modulos"
          tar --zstd -tf artifacts/a34-6.6.127/a34-all-modules.tar.zst > /tmp/mods.txt
          for ko in \
            "mt6877-mt6359.ko" \
            "snd-soc-mt6877-afe.ko" \
            "snd-soc-mtk-common.ko" \
            "snd-soc-mt6359.ko" ; do
            grep -q "/$ko$" /tmp/mods.txt \
              && echo "OK  $ko" \
              || { echo "FALTA $ko"; exit 1; }
          done
          if grep -q "/mtk-afe-external.ko$" /tmp/mods.txt; then
            echo "OK  mtk-afe-external.ko"
          else
            echo "AVISO: falta mtk-afe-external.ko (SMART_PHONE)"
          fi
          if grep -q "/isee.ko$" /tmp/mods.txt; then
            echo "FALTA: isee.ko esta como modulo (el TEE va built-in)"
            exit 1
          fi
          echo "OK  sin isee.ko"

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-full
          path: artifacts/
          if-no-files-found: warn

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-full-logs
          path: logs/
          if-no-files-found: warn
