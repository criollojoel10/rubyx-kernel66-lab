name: Build ruby kernel completo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          set +e
          sudo apt-get remove --purge -y 'php*' 'dotnet*' 'mysql*' 'nodejs*' 'clang*' 'google*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$d"
          done
          set -e
          df -h

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates gnupg python3 python3-pip \
            bc bison flex cpio libssl-dev libelf-dev lz4 zstd unzip patch
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Caché Bazel + Clang
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/ruby/clang-r536225
          key: a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ hashFiles('port/**') }}-${{ hashFiles('scripts/apply-ruby-fragment.sh') }}-${{ github.sha }}
          restore-keys: |
            a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            ds-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            core-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            kabi-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            mt-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            panel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            fast-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            bazel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-

      - name: Fetch A34
        run: make fetch

      - name: Aplicar todos los ports de ruby
        run: ./port/apply-all.sh

      - name: Build del kernel de producto
        run: make build-fast

      - name: Recolectar
        run: make collect

      - name: Verificar los drivers de ruby
        run: |
          set -e
          IMG=artifacts/a34-6.6.127/Image
          CFG=artifacts/a34-6.6.127/config

          # 1) los drivers built-in dejan su cadena de compatible en el Image;
          #    es mas fiable que buscar simbolos (casi todos son static)
          echo "== cadenas de compatible en el Image"
          for s in \
            "mediatek,mt6877-mt6359-sound" \
            "panel-m16-42-0d-0a-dsc-vdo" \
            "focaltech,3680-spi" \
            "goodix,goodix-fp" \
            "aw882xx" ; do
            strings "$IMG" | grep -qF "$s" \
              && echo "OK  $s" \
              || { echo "FALTA $s"; exit 1; }
          done

          # 2) la config que el Image lleva dentro, si el IKCONFIG esta activo
          if [ -s "$CFG" ]; then
            echo "== config del Image"
            for sym in \
              CONFIG_DRM_MEDIATEK_V2 \
              CONFIG_DRM_PANEL_M16_42_0D_0A_DSC_VDO \
              CONFIG_TOUCHSCREEN_FOCALTECH_3680 \
              CONFIG_GOODIX_CAP_FINGERPRINT \
              CONFIG_MICROTRUST_TEE_SUPPORT \
              CONFIG_SND_SOC_MEDIATEK \
              CONFIG_SND_SOC_MT6877 \
              CONFIG_SND_SOC_MT6877_MT6359P \
              CONFIG_SND_SMARTPA_AW882XX ; do
              grep -qx "$sym=y" "$CFG" \
                && echo "OK  $sym" \
                || { echo "FALTA $sym=y"; exit 1; }
            done
          else
            echo "AVISO: el Image no lleva config (IKCONFIG), me quedo con las cadenas"
          fi

          # 3) el TEE no puede haberse colado como modulo: si existe isee.ko,
          #    el arbol de device modules lo compilo y el build esta mal
          echo "== modulos"
          tar --zstd -tf artifacts/a34-6.6.127/a34-all-modules.tar.zst > /tmp/mods.txt
          if grep -q 'teei/400/isee.ko' /tmp/mods.txt; then
            echo "FALTA: isee.ko esta como modulo (el TEE va built-in)"
            exit 1
          fi
          echo "OK  sin isee.ko"

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-full
          path: artifacts/
          if-no-files-found: warn

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-full-logs
          path: logs/
          if-no-files-found: warn
