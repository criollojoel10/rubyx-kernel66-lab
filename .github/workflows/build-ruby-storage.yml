name: Build ruby storage kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          set +e
          sudo apt-get remove --purge -y 'php*' 'dotnet*' 'mysql*' 'nodejs*' 'clang*' 'google*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$d"
          done
          set -e
          df -h

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates gnupg python3 python3-pip \
            bc bison flex cpio libssl-dev libelf-dev lz4 zstd unzip patch
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"

      - name: Caché Bazel + Clang
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/ruby/clang-r536225
          key: a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ github.sha }}
          restore-keys: |
            a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            ds-a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            core-a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            kabi-a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            mt-a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            panel-a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            fast-a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            bazel-a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
      - name: Fetch A34
        run: make fetch

      - name: Build storage
        run: make build-storage

      - name: Recolectar
        run: make collect

      - name: Verificar UFS en config
        run: |
          grep -E '^CONFIG_DEVICE_MODULES_(SCSI_UFS_MEDIATEK|PHY_MTK_UFS|MTK_IOMMU)=m' artifacts/a34-6.6.127/device-modules.config
          grep -E '^# CONFIG_(SEC_UFS_FEATURE|SCSI_UFS_MEDIATEK_DBG|MTK_BLOCK_IO_TRACER) is not set' artifacts/a34-6.6.127/device-modules.config

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a34-storage
          path: artifacts/
          if-no-files-found: warn

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a34-storage-logs
          path: logs/
          if-no-files-found: warn
