name: Build A34 6.6.127 reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout laboratorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          set +e
          sudo apt-get remove --purge -y 'php*' 'dotnet*' 'mysql*' 'nodejs*' 'clang*' 'google*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/share/boost; do
            sudo rm -rf "$d"
          done
          set -e
          df -h
          free -h

      - name: Dependencias del build oficial
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates gnupg python3 python3-pip \
            bc bison flex cpio libssl-dev libelf-dev lz4 zstd unzip
          git config --global user.name "rubyx-kernel66-lab"
          git config --global user.email "lab@users.noreply.github.com"
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
          sudo ln -sf /tmp/mkbootimg/unpack_bootimg.py /usr/local/bin/unpack_bootimg
          sudo chmod +x /tmp/mkbootimg/unpack_bootimg.py
          python3 --version

      - name: Caché de acciones de Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-${{ github.sha }}
          restore-keys: |
            a34-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            ds-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            core-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            kabi-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            mt-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            panel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            fast-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
            bazel-${{ hashFiles('manifests/a34-6.6.127.lock.json') }}-
      - name: Fetch A34 6.6.127 (tag y submódulo fijados)
        run: make fetch

      - name: Build de referencia (sin parches)
        run: make build

      - name: Recolectar artefactos
        run: make collect

      - name: Verificar
        run: make verify

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a34-6.6.127-reference
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a34-6.6.127-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30
